<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Lead Capture Form</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--error:#dc2626;--success-bg:#ecfdf5;--success-border:#10b981;--bg:#f9fafb;--surface:#fff;--radius:6px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:24px 16px}.container{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px}header{margin-bottom:24px}header h1{font-size:1.5rem;margin:0 0 6px}header p{margin:0;color:var(--muted);font-size:.95rem}.form-group{margin-bottom:20px}label,legend{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}input[type=text],input[type=email],select,textarea{width:100%;padding:10px 12px;font-size:1rem;font-family:inherit;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}input.invalid,select.invalid,textarea.invalid{border-color:var(--error)}fieldset{border:none;padding:0;margin:0}.radio-group{display:flex;gap:20px;flex-wrap:wrap}.radio-option{display:flex;align-items:center;gap:6px;font-weight:normal}.radio-option input{width:auto}.error-message{color:var(--error);font-size:.82rem;margin-top:4px;min-height:1em}.char-counter{text-align:right;font-size:.8rem;color:var(--muted);margin-top:4px}.char-counter.limit-reached{color:var(--error);font-weight:600}button[type=submit]{width:100%;padding:12px;background:var(--primary);color:#fff;font-size:1rem;font-weight:600;border:none;border-radius:var(--radius);cursor:pointer}button[type=submit]:hover{background:var(--primary-dark)}button[type=submit]:disabled{opacity:.65;cursor:not-allowed}.thank-you{text-align:center;padding:24px;background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius)}.thank-you h2{margin-top:0;color:#065f46}.hidden{display:none}@media(max-width:480px){.container{padding:24px 18px}}
</style>
</head>
<body>
<div class="container">
<header><h1>Student Lead Capture Form</h1><p>Tell us a bit about yourself and we'll get in touch about study options.</p></header>
<form id="leadForm" novalidate>
<div class="form-group"><label for="fullName">Full Name</label><input type="text" id="fullName" name="fullName" aria-describedby="fullNameError"><div class="error-message" id="fullNameError"></div></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" aria-describedby="emailError"><div class="error-message" id="emailError"></div></div>
<div class="form-group"><label for="country">Country</label><select id="country" name="country" aria-describedby="countryError"><option value="">Select your country</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option><option>Germany</option><option>United Arab Emirates</option><option>Singapore</option><option>Other</option></select><div class="error-message" id="countryError"></div></div>
<div class="form-group"><fieldset><legend>Course Level</legend><div class="radio-group"><div class="radio-option"><input type="radio" id="levelUG" name="courseLevel" value="UG"><label for="levelUG">UG</label></div><div class="radio-option"><input type="radio" id="levelPG" name="courseLevel" value="PG"><label for="levelPG">PG</label></div><div class="radio-option"><input type="radio" id="levelPhD" name="courseLevel" value="PhD"><label for="levelPhD">PhD</label></div></div></fieldset><div class="error-message" id="courseLevelError"></div></div>
<div class="form-group"><label for="university">Preferred University</label><input type="text" id="university" name="university" aria-describedby="universityError"><div class="error-message" id="universityError"></div></div>
<div class="form-group"><label for="message">Message</label><textarea id="message" name="message" maxlength="300" aria-describedby="messageError messageCounter"></textarea><div class="char-counter" id="messageCounter">0 / 300</div><div class="error-message" id="messageError"></div></div>
<button type="submit">Submit</button>
</form>
<div class="thank-you hidden" id="thankYou" role="status"><h2>Thank you!</h2><p>We've received your details and will reach out soon.</p></div>
</div>
<script>
const form=document.getElementById('leadForm');const thankYou=document.getElementById('thankYou');const messageInput=document.getElementById('message');const messageCounter=document.getElementById('messageCounter');
messageInput.addEventListener('input',()=>{const length=messageInput.value.length;messageCounter.textContent=`${length} / 300`;messageCounter.classList.toggle('limit-reached',length>=300)});
function setError(fieldId,message){const errorEl=document.getElementById(`${fieldId}Error`);const inputEl=document.getElementById(fieldId);errorEl.textContent=message;if(inputEl)inputEl.classList.toggle('invalid',Boolean(message))}
function isValidEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)}
function validateForm(){let isValid=true;let firstInvalidField=null;const fullName=document.getElementById('fullName').value.trim();if(!fullName){setError('fullName','Full name is required.');isValid=false;firstInvalidField=firstInvalidField||'fullName'}else setError('fullName','');const email=document.getElementById('email').value.trim();if(!email){setError('email','Email is required.');isValid=false;firstInvalidField=firstInvalidField||'email'}else if(!isValidEmail(email)){setError('email','Please enter a valid email address.');isValid=false;firstInvalidField=firstInvalidField||'email'}else setError('email','');const country=document.getElementById('country').value;if(!country){setError('country','Please select a country.');isValid=false;firstInvalidField=firstInvalidField||'country'}else setError('country','');const course=document.querySelector('input[name="courseLevel"]:checked');const courseError=document.getElementById('courseLevelError');if(!course){courseError.textContent='Please select a course level.';isValid=false;firstInvalidField=firstInvalidField||'levelUG'}else courseError.textContent='';const university=document.getElementById('university').value.trim();if(!university){setError('university','Preferred university is required.');isValid=false;firstInvalidField=firstInvalidField||'university'}else setError('university','');const message=messageInput.value.trim();if(!message){setError('message','Message is required.');isValid=false;firstInvalidField=firstInvalidField||'message'}else setError('message','');return{isValid,firstInvalidField}}
form.addEventListener('submit',(event)=>{event.preventDefault();const{isValid,firstInvalidField}=validateForm();if(!isValid){if(firstInvalidField)document.getElementById(firstInvalidField).focus();return}const formData={fullName:document.getElementById('fullName').value.trim(),email:document.getElementById('email').value.trim(),country:document.getElementById('country').value,courseLevel:document.querySelector('input[name="courseLevel"]:checked').value,university:document.getElementById('university').value.trim(),message:messageInput.value.trim()};console.log(JSON.stringify(formData,null,2));form.classList.add('hidden');thankYou.classList.remove('hidden')});
</script>
</body>
</html>
